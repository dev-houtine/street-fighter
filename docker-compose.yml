services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_PASSWORD: street_fighter_123
      POSTGRES_USER: street_fighter
      POSTGRES_DB: street_fighter_development
    ports:
      - "5433:5432"
    volumes:
      - app_db:/var/lib/postgresql/data
  mailpit:
    image: axllent/mailpit:latest
    restart: always
    ports:
      - "1026:1025"
      - "8026:8025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    volumes:
      - mailpit_data:/data
volumes:
  app_db:
  mailpit_data:
