service: street_fighter

image: gunsline/street_fighter

servers:
  web:
    - 89.167.17.134

proxy:
  ssl: true
  hosts:
    - street-fighter.houtine.com

registry:
  username: gunsline
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - POSTGRES_PASSWORD
  clear:
    DB_HOST: street_fighter-db
    DB_NAME: street_fighter_production
    DB_USER: street_fighter

builder:
  arch: amd64

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

accessories:
  db:
    image: postgres:17
    host: 89.167.17.134
    port: "127.0.0.1:5435:5432"
    env:
      clear:
        POSTGRES_USER: street_fighter
        POSTGRES_DB: street_fighter_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data

volumes:
  - "street_fighter_storage:/rails/storage"

asset_path: /rails/public/assets
